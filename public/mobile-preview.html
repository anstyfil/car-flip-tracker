<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>АвтоКапитал — мобильный просмотр</title>
<style>body{margin:0;min-height:100vh;background:#e8ede5;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#254633;display:flex;align-items:center;justify-content:center;gap:50px;padding:25px;box-sizing:border-box}aside{max-width:210px}h1{font-size:30px;letter-spacing:-1px;line-height:1.1}p{line-height:1.8;color:#7b8c70;font-size:12px}a{color:#456c32}iframe{width:390px;height:800px;border:8px solid #254633;border-radius:28px;background:#f5f7f4;box-shadow:0 20px 60px #25463320;flex-shrink:0}label{display:block;margin:25px 0 10px;font-size:11px}select{padding:10px;border:1px solid #c9d6c2;border-radius:7px;background:#f5f7f0;color:#456c32}@media(max-width:650px){body{padding:8px;display:block}aside{display:none}iframe{display:block;margin:auto;width:min(390px,calc(100vw - 32px));height:calc(100dvh - 32px)}}</style></head>
<body><aside><span>ЛОКАЛЬНЫЙ ПРОТОТИП</span><h1>Мобильный просмотр</h1><p>Предварительный просмотр интерфейса при ширине экрана телефона.</p><label for="size">Ширина экрана</label><select id="size"><option value="360">360 px · небольшой телефон</option><option value="390" selected>390 px · телефон</option><option value="430">430 px · большой телефон</option></select><p><a href="/">Открыть обычный просмотр</a></p></aside><iframe src="/" title="Мобильный прототип АвтоКапитал"></iframe><script>document.getElementById('size').addEventListener('change',event=>{document.querySelector('iframe').style.width=event.target.value+'px';});</script></body>
</html>
